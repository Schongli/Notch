name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Tests that talk to lrclib.net, the Windows shell or render pages are #[ignore]d: `cargo test -- --ignored`.
      - run: cargo test --locked
